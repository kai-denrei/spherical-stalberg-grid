<!doctype html><meta charset="utf-8"><base href="/"><title>tank view</title>
<style>html,body{margin:0;background:#05070c;overflow:hidden}canvas{display:block}
#lbl{position:fixed;left:8px;top:6px;font:12px monospace;color:#9fdcff;z-index:9}</style>
<div id="lbl">loading…</div>
<script type="module">
import * as THREE from '/vendor/three.module.js';

const W=900,H=700;
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); r.setPixelRatio(2);
document.body.appendChild(r.domElement);
const sc=new THREE.Scene(); sc.background=new THREE.Color(0x05070c);
const cam=new THREE.PerspectiveCamera(35,W/H,0.01,100);
sc.add(new THREE.HemisphereLight(0xc8cfe0,0x555060,1.5));
const sun=new THREE.DirectionalLight(0xffe8c8,1.1); sun.position.set(3,5,2); sc.add(sun);
const fill=new THREE.DirectionalLight(0x8a96c8,0.8); fill.position.set(-3,1,-2); sc.add(fill);
const q=new URLSearchParams(location.search);
const which=q.get('unit')||'mkcx';
const ang=parseFloat(q.get('ang')||'0.6');
async function go(){
  // dev tool: dynamic import with a time key, so it never serves a stale
  // module and never carries a ?v= token for check-tokens.sh to trip over
  const { buildUnit, preloadMkcx, makeDotEnemy, makePortalCloud } = await import('/src/units.js?dev=' + Date.now());
  const TF = await import('/src/tankfeel.js?dev=' + Date.now());
  const { applyTankHealth } = TF;
  if(which==='mkcx') await preloadMkcx();
  // ?dot=1 builds the TD cloud form (makeDotEnemy) rather than the mesh
  // form in UNITS — the two are different objects and only the cloud ships
  // in the tower-defence tab.
  const cols={walker:q.get('dim')?0x2a3550:0x6f9cff,walkerHi:0x7df9ff};
  // ?portal=<0..1> builds the gate at a given dial-in, so the draw-on can
  // be seen mid-stroke instead of only in its finished state
  let g;
  if(q.get('portal')!==null){
    g=makePortalCloud({body:0xcfd8ff,hi:0xffffff},0);
    g.userData.tick(1.1);
    g.userData.setForm(parseFloat(q.get('portal')||'1'));
  } else g=q.get('dot')?makeDotEnemy(which,cols):buildUnit(which,cols);
  sc.add(g);
  const box=new THREE.Box3().setFromObject(g); const s=new THREE.Vector3(); box.getSize(s);
  const c=new THREE.Vector3(); box.getCenter(c);
  const d=Math.max(...s.toArray())*2.2/parseFloat(q.get('zoom')||'1');
  const el=parseFloat(q.get('el')||'0.45');
  // el is a DIRECTION component, not a distance multiplier — otherwise
  // raising it pushes the camera away and zoom can't compensate
  const off=new THREE.Vector3(Math.sin(ang), el, Math.cos(ang)).normalize().multiplyScalar(d);
  cam.position.copy(c).add(off);
  cam.lookAt(c);
  if(q.get('notubes')) (g.userData.laserGuns||[]).forEach(gn=>{ if(gn.children[0]) gn.remove(gn.children[0]); });
  if(q.get('nosleeve') && g.userData.heatSleeve) g.userData.heatSleeve.parent.remove(g.userData.heatSleeve);
  if(q.get('nodots')) (g.userData.ammoDots||[]).forEach(d=>d.parent.remove(d));
  if(q.get('noedges')) { const rm=[]; g.traverse(o=>{if(o.isLineSegments) rm.push(o);}); rm.forEach(o=>o.parent.remove(o)); }
  if(g.userData.tick && q.get('sweep')!=='0') g.userData.tick(1.2);
  // light the ammo rack like the game does: 4 of 9 lit
  const dots=g.userData.ammoDots||[];
  dots.forEach((dd,i)=>dd.material.color.setHex(i<4?0xffffff:0x4a505c));
  applyTankHealth(g, parseFloat(q.get('hp') ?? '1'));
  // ?hover=0..1 settles/raises the rig; ?exag scales the travel so the split
  // between emitters, skirt and body is visible in a still frame.
  if(q.get('hover')!==null){
    const st=TF.makeTankFeel(); st.hoverT=parseFloat(q.get('hover')||'1'); st.t=0.7;
    const k=parseFloat(q.get('exag')||'1');
    const P={...TF.TANK_FEEL, rise:TF.TANK_FEEL.rise*k, gearDrop:TF.TANK_FEEL.gearDrop*k,
             vib:TF.TANK_FEEL.vib*k};
    if(q.get('fire')) TF.fireTankFeel(st,P);
    TF.applyTankFeel(g,st,P);
  }
  if(q.get('rig')){
    const path=o=>{const a=[];for(let x=o;x&&x!==g;x=x.parent)a.unshift(x.name||x.type);return a.join('/')};
    const u=g.userData;
    for(const k of ['hoverBody','hoverGear','hoverEmitters','hoverHull','hoverWeapons','turret','secondaries'])
      console.log('RIG',k,u[k]?path(u[k]):'MISSING',u[k]?`kids=${u[k].children.length}`:'');
    let meshes=0; (u.hoverHull||{traverse:()=>{}}).traverse(o=>{if(o.isMesh)meshes++;});
    console.log('RIG hull meshes', meshes);
    let em=0; (u.hoverEmitters||{traverse:()=>{}}).traverse(o=>{if(o.isMesh)em++;});
    console.log('RIG emitter meshes', em);
  }
  r.render(sc,cam);
  const bs=g.userData.baseScale ?? 1;
  document.getElementById('lbl').textContent =
    which+'  size '+s.toArray().map(v=>v.toFixed(2)).join(' x ')+'  dots '+dots.length;
  console.log('FIT', which, 'baseScale', bs.toFixed(4),
    'raw w/h/l', s.toArray().map(v=>v.toFixed(3)).join('/'),
    '=> WORLD per unitScale w/h/l',
    s.toArray().map(v=>(v*bs).toFixed(4)).join('/'));
}
go();
</script>
