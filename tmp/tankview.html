<!doctype html><meta charset="utf-8"><base href="/"><title>tank view</title>
<style>html,body{margin:0;background:#05070c;overflow:hidden}canvas{display:block}
#lbl{position:fixed;left:8px;top:6px;font:12px monospace;color:#9fdcff;z-index:9}</style>
<div id="lbl">loading…</div>
<script type="module">
import * as THREE from '/vendor/three.module.js';

const W=900,H=700;
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); r.setPixelRatio(2);
document.body.appendChild(r.domElement);
const sc=new THREE.Scene(); sc.background=new THREE.Color(0x05070c);
const cam=new THREE.PerspectiveCamera(35,W/H,0.01,100);
sc.add(new THREE.HemisphereLight(0xc8cfe0,0x555060,1.5));
const sun=new THREE.DirectionalLight(0xffe8c8,1.1); sun.position.set(3,5,2); sc.add(sun);
const fill=new THREE.DirectionalLight(0x8a96c8,0.8); fill.position.set(-3,1,-2); sc.add(fill);
const q=new URLSearchParams(location.search);
const which=q.get('unit')||'mkcx';
const ang=parseFloat(q.get('ang')||'0.6');
async function go(){
  // dev tool: dynamic import with a time key, so it never serves a stale
  // module and never carries a ?v= token for check-tokens.sh to trip over
  const { buildUnit, preloadMkcx } = await import('/src/units.js?dev=' + Date.now());
  if(which==='mkcx') await preloadMkcx();
  const g=buildUnit(which,{walker:0x2a3550,walkerHi:0x7df9ff});
  sc.add(g);
  const box=new THREE.Box3().setFromObject(g); const s=new THREE.Vector3(); box.getSize(s);
  const c=new THREE.Vector3(); box.getCenter(c);
  const d=Math.max(...s.toArray())*2.2/parseFloat(q.get('zoom')||'1');
  const el=parseFloat(q.get('el')||'0.45');
  // el is a DIRECTION component, not a distance multiplier — otherwise
  // raising it pushes the camera away and zoom can't compensate
  const off=new THREE.Vector3(Math.sin(ang), el, Math.cos(ang)).normalize().multiplyScalar(d);
  cam.position.copy(c).add(off);
  cam.lookAt(c);
  if(q.get('notubes')) (g.userData.laserGuns||[]).forEach(gn=>{ if(gn.children[0]) gn.remove(gn.children[0]); });
  if(q.get('nosleeve') && g.userData.heatSleeve) g.userData.heatSleeve.parent.remove(g.userData.heatSleeve);
  if(q.get('nodots')) (g.userData.ammoDots||[]).forEach(d=>d.parent.remove(d));
  if(q.get('noedges')) { const rm=[]; g.traverse(o=>{if(o.isLineSegments) rm.push(o);}); rm.forEach(o=>o.parent.remove(o)); }
  if(g.userData.tick) g.userData.tick(1.2);
  // light the ammo rack like the game does: 4 of 9 lit
  const dots=g.userData.ammoDots||[];
  dots.forEach((dd,i)=>dd.material.color.setHex(i<4?0xffffff:0x4a505c));
  r.render(sc,cam);
  document.getElementById('lbl').textContent =
    which+'  size '+s.toArray().map(v=>v.toFixed(2)).join(' x ')+'  dots '+dots.length;
}
go();
</script>
