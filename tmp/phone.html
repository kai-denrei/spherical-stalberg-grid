<!doctype html><meta charset="utf-8"><title>phone frame</title>
<!-- Dev harness. Headless Chrome will not honour --window-size below ~500px:
     it lays out at 500 and CROPS the screenshot, so a 390px screenshot is a
     lie about where anything sits. An iframe DOES get the width you give it,
     media queries and all, so this is the only way to see a real phone
     layout without a phone. ?u= is the page, ?w=/?h= the device size. -->
<style>
  html,body{margin:0;background:#111;display:flex;align-items:flex-start;justify-content:flex-start}
  iframe{border:0;display:block;background:#000}
</style>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get('w') || '390', 10);
  const h = parseInt(q.get('h') || '844', 10);
  const u = q.get('u') || '/?tutorial=0&tick=4#td';
  const f = document.createElement('iframe');
  f.width = w; f.height = h; f.src = u;
  document.body.appendChild(f);
</script>
