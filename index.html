<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spherical stålberg grid</title>
  <link rel="stylesheet" href="/styles.css?v=354e4d92">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="cb" content="354e4d92">
  <link rel="icon" type="image/svg+xml" href="/cb-shapes/53.svg?v=354e4d92">
  <script src="/cb-badge.js?v=354e4d92" defer></script>
</head>
<body>
  <nav id="tabbar">
    <button data-tab="grid" class="active">grid</button>
    <button data-tab="maze">maze</button>
  </nav>

  <div id="tab-grid" class="tab">
    <div id="app"></div>
    <div id="stats"></div>
    <div id="hint">drag to orbit · scroll to zoom · panel top-right</div>
  </div>

  <div id="tab-maze" class="tab tab-hidden">
    <div id="maze-app"></div>
    <div id="maze-stats"></div>
    <div id="maze-msg" class="hidden"></div>
    <div id="dpad">
      <button id="pad-up" title="forward (↑ / W)">▲</button>
      <div class="dpad-row">
        <button id="pad-left" title="left (← / A)">◀</button>
        <button id="pad-hint" title="pulse the way to the heart">☆</button>
        <button id="pad-right" title="right (→ / D)">▶</button>
      </div>
      <button id="pad-down" title="turn back (↓ / S)">▼</button>
    </div>
    <div id="maze-hint">arrows / WASD to walk · ☆ pulses the way · minimap bottom-left</div>
  </div>

  <script type="module" src="/src/main.js?v=354e4d92"></script>
</body>
</html>
